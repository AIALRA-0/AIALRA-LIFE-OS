<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Aialra Life OS private execution command center</title>
  <desc id="desc">A private daily planning loop connects cognitive routes, an auditable timeline, skill evidence, resources, and agent runs</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020914"/>
      <stop offset="0.5" stop-color="#071426"/>
      <stop offset="1" stop-color="#150c2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36d9e8"/>
      <stop offset="1" stop-color="#9c55ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101c31" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#091322" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000714" flood-opacity="0.72"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#2c6f82" stroke-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1440" height="720" rx="34" fill="url(#bg)"/>
  <rect width="1440" height="720" rx="34" fill="url(#grid)"/>
  <circle cx="130" cy="90" r="240" fill="#26d4e5" opacity="0.07"/>
  <circle cx="1320" cy="650" r="310" fill="#a855f7" opacity="0.08"/>

  <g transform="translate(92 66)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect width="74" height="74" rx="20" fill="#0c2235" stroke="#3dd8e7" stroke-width="2"/>
    <path d="M20 20h34v34H20z" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M27 31h20M27 41h14M27 50h18" stroke="#d7f8fb" stroke-width="4" stroke-linecap="round"/>
    <text x="104" y="43" fill="#f8fbff" font-size="46" font-weight="780">Aialra Life OS</text>
    <text x="106" y="77" fill="#91a6bf" font-size="18">Private planning · execution evidence · cognitive routes · auditable agents</text>
  </g>

  <g transform="translate(1075 86)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="720">
    <rect width="120" height="36" rx="18" fill="#0b2b38" stroke="#36d9e8"/>
    <text x="60" y="23" text-anchor="middle" fill="#9cecf3">PRIVATE</text>
    <rect x="132" width="142" height="36" rx="18" fill="#23143f" stroke="#a855f7"/>
    <text x="203" y="23" text-anchor="middle" fill="#d8b8ff">AUDIT FIRST</text>
  </g>

  <g transform="translate(70 217)" font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g>
      <rect width="350" height="350" rx="26" fill="url(#panel)" stroke="#24526a" stroke-width="2"/>
      <text x="32" y="52" fill="#eef8ff" font-size="23" font-weight="730">Cognitive routes</text>
      <text x="32" y="82" fill="#8199b4" font-size="15">Long-term direction becomes today's work</text>
      <g transform="translate(32 113)">
        <circle cx="17" cy="17" r="16" fill="#12394a" stroke="#36d9e8"/>
        <path d="M12 17h10M18 11l6 6-6 6" fill="none" stroke="#9cecf3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="15" fill="#d8e8f5" font-size="15" font-weight="680">Route stage</text>
        <text x="52" y="35" fill="#7890aa" font-size="13">week · topic · evidence gate</text>
        <path d="M17 38v43" stroke="#31576d" stroke-width="3"/>
        <circle cx="17" cy="99" r="16" fill="#231a3c" stroke="#9c55ff"/>
        <path d="M9 99h16M17 91v16" stroke="#dbc2ff" stroke-width="3" stroke-linecap="round"/>
        <text x="52" y="96" fill="#d8e8f5" font-size="15" font-weight="680">Fixed and flexible slots</text>
        <text x="52" y="116" fill="#7890aa" font-size="13">protected anchors · repairable blocks</text>
        <path d="M17 120v43" stroke="#31576d" stroke-width="3"/>
        <circle cx="17" cy="181" r="16" fill="#12394a" stroke="#36d9e8"/>
        <path d="M9 181l6 6 11-13" fill="none" stroke="#9cecf3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="52" y="178" fill="#d8e8f5" font-size="15" font-weight="680">Verifiable output</text>
        <text x="52" y="198" fill="#7890aa" font-size="13">artifact · check-in · confidence</text>
      </g>
    </g>

    <g transform="translate(475 0)">
      <rect width="420" height="350" rx="26" fill="url(#panel)" stroke="#2c5f75" stroke-width="2"/>
      <text x="32" y="52" fill="#eef8ff" font-size="23" font-weight="730">Daily execution loop</text>
      <text x="32" y="82" fill="#8199b4" font-size="15">Plan, act, record, repair, review</text>
      <g transform="translate(32 111)">
        <rect width="356" height="48" rx="12" fill="#0b2535" stroke="#2d6174"/>
        <text x="20" y="21" fill="#8be8f0" font-size="12" font-weight="700">PRIVATE ANCHORS</text>
        <text x="20" y="38" fill="#d8e8f5" font-size="14">Wake · meals · shutdown · sleep boundary</text>
        <rect y="64" width="356" height="50" rx="12" fill="#111e32" stroke="#314760"/>
        <text x="20" y="86" fill="#f4f8ff" font-size="14" font-weight="680">Current block</text>
        <rect x="240" y="78" width="94" height="22" rx="11" fill="#123f4a"/>
        <text x="287" y="93" text-anchor="middle" fill="#82e6ef" font-size="11" font-weight="700">IN PROGRESS</text>
        <rect y="130" width="356" height="82" rx="12" fill="#15142b" stroke="#4f3770"/>
        <text x="20" y="155" fill="#d7c2f5" font-size="12" font-weight="700">REPAIR PLAN</text>
        <text x="20" y="177" fill="#e7edf7" font-size="14">Preserve protected anchors</text>
        <text x="20" y="198" fill="#8b9db3" font-size="13">Move only flexible work into audited slots</text>
      </g>
    </g>

    <g transform="translate(950 0)">
      <rect width="350" height="350" rx="26" fill="url(#panel)" stroke="#4d3d72" stroke-width="2"/>
      <text x="32" y="52" fill="#eef8ff" font-size="23" font-weight="730">Evidence command center</text>
      <text x="32" y="82" fill="#8199b4" font-size="15">Every automated action leaves a trace</text>
      <g transform="translate(32 113)">
        <rect width="286" height="61" rx="13" fill="#111d30" stroke="#2c4c65"/>
        <text x="18" y="25" fill="#f0f7ff" font-size="14" font-weight="680">Skill evidence</text>
        <text x="18" y="45" fill="#7f96ae" font-size="13">level · next gate · confidence</text>
        <rect y="76" width="286" height="61" rx="13" fill="#111d30" stroke="#2c4c65"/>
        <text x="18" y="101" fill="#f0f7ff" font-size="14" font-weight="680">Agent runs</text>
        <text x="18" y="121" fill="#7f96ae" font-size="13">input · output · status · error</text>
        <rect y="152" width="286" height="61" rx="13" fill="#1a1530" stroke="#5a3f80"/>
        <text x="18" y="177" fill="#eadcff" font-size="14" font-weight="680">Daily review</text>
        <text x="18" y="197" fill="#9986b6" font-size="13">completion · friction · next action</text>
      </g>
    </g>
  </g>

  <path d="M420 392h125" stroke="#3bd9e8" stroke-width="4" stroke-dasharray="8 8"/>
  <path d="M965 392h55" stroke="#9c55ff" stroke-width="4" stroke-dasharray="8 8"/>
  <text x="720" y="648" text-anchor="middle" fill="#8297b0" font-size="17" font-family="Inter,Segoe UI,Arial,sans-serif">Long-term routes → daily plan → check-ins → evidence → review → next plan</text>
</svg>
